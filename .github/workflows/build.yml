name: Build & Release SolarGuard APK

on:
  # Trigger on version tags like v1.0.0, v1.2.3, or release-v2.2.5
  push:
    tags:
      - 'v*.*.*'
      - 'release-v*.*.*'

  # Also allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture (arm64-v8a for the connected Android phone)'
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - all

jobs:
  build:
    name: Build Android APK locally on GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ── 3. Set up Java for Android build ──────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 4. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check types and core behavior
        run: |
          npm run typecheck
          npm test

      # ── 5. Install Android NDK ────────────────────────────────────────────
      - name: Install exact NDK version
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      # ── 6. Generate Native Android Code (Prebuild) ────────────────────────
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      # ── 7. Build the APKs using Gradle ────────────────────────────────────
      - name: Build Android APKs
        working-directory: android
        env:
          BUILD_ARCHITECTURE: ${{ inputs.architecture || 'all' }}
        run: |
          if [ "$BUILD_ARCHITECTURE" = "arm64-v8a" ]; then
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
          else
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          fi

      # ── 8. Upload APK Artifacts (Private) ─────────────────────────────────
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SolarGuard-APKs-${{ github.ref_name || github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      # ── 9. Create Public GitHub Release ───────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref_name, 'release-')
        uses: softprops/action-gh-release@v2
        with:
          name: SolarGuard ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            ## SolarGuard ${{ github.ref_name }}
            Official public release of SolarGuard.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
